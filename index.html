</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">B</div><div><strong>BPT <span style="color:#82b3ff">ONE</span></strong><small>CONNECTED OPERATIONS</small></div></div><div class="side-label">WORKSPACE</div><nav class="nav" id="sideNav"></nav><div class="side-bottom"><b>One trip. One workflow.</b>Connected data for every team.<br><br>PROTOTYPE · DEMO DATA</div></aside><div class="shell"><header class="topbar"><div class="breadcrumb">Workspace &nbsp;/&nbsp; <b id="crumb">Management</b></div><div class="top-right"><div class="sync"><span class="dot"></span> Booking App Synced</div><div class="divider"></div><div class="sync"><span class="dot"></span> GPS Active</div><div class="divider"></div><div class="avatar">MD</div></div></header><main class="content" id="content"></main></div></div><nav class="mobile-nav" id="mobileNav"></nav><div class="toast" id="toast" role="status"></div><script>
const icons={

 route:'<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h5a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h5"/>',
 truck:'<path d="M3 5h11v11H3zM14 9h4l3 3v4h-7z"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>',

 spark:'<path d="m12 3 1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6L12 3zM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16z"/>'
};
function icon(name){return `<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${icons[name]}</svg>`}
const views=[['management','dashboard','Management'],['operations','clipboard','Operations'],['driver','driver','Driver App'],['maintenance','wrench','Maintenance'],['finance','receipt','Finance']];
let state={view:'management',stage:'waiting',diagnosed:false,repaired:false,invoice:false,photo:null};
let reporting=false, draftPhoto=null, photoRequest=0;
try{const saved=JSON.parse(localStorage.getItem('bpt-one-demo'));if(saved&&['waiting','passed','issue','fixed','completed'].includes(saved.stage))state={...state,...saved,view:'management'}}catch(e){}
function save(){try{localStorage.setItem('bpt-one-demo',JSON.stringify(state));return true}catch(e){notify('Storage is full; this report is available only until you reload.');return false}}
function go(v){state.view=v;render();window.scrollTo(0,0)}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2800)}
function act(action){if(action==='reset'){photoRequest++;reporting=false;draftPhoto=null;state={view:state.view,stage:'waiting',diagnosed:false,repaired:false,invoice:false,photo:null};notify('Demo reset to the starting point.')}if(action==='issue'){if(!draftPhoto){notify('Please take or choose a photo first.');return}state.photo=draftPhoto;reporting=false;draftPhoto=null;state.stage='issue';state.diagnosed=false;notify('Issue and photo reported. Trip #8801 is suspended.')}if(action==='pass'){state.stage='passed';notify('Inspection passed. Trip #8801 is ready to dispatch.')}if(action==='diagnose'){state.diagnosed=true;notify('Suggested diagnostic plan generated.')}if(action==='fix'){state.stage='fixed';state.repaired=true;notify('Repair marked as fixed. Vehicle is ready for dispatch.')}if(action==='complete'){state.stage='completed';notify('Trip completed. Billable data is ready for Finance.')}if(action==='invoice'){state.invoice=true;notify('Draft invoice generated for Trip #8801.')}save();render()}
function photoData(value){return typeof value==='string' && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(value) ? value : ''}
function startReport(){reporting=true;draftPhoto=null;render()}
function cancelReport(){photoRequest++;reporting=false;draftPhoto=null;render()}
function readPhoto(input){const file=input.files && input.files[0];if(!file)return;if(!file.type.startsWith('image/')){notify('Please select an image file.');input.value='';return}if(file.size>20*1024*1024){notify('Please choose an image smaller than 20 MB.');input.value='';return}const request=++photoRequest;const reader=new FileReader();reader.onerror=()=>notify('Could not read the photo. Please try again.');reader.onload=()=>{const image=new Image();image.onerror=()=>notify('Could not open this image. Please try another.');image.onload=()=>{if(request!==photoRequest||!reporting)return;try{const scale=Math.min(1,1200/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);draftPhoto=canvas.toDataURL('image/jpeg',0.75);render()}catch(e){notify('Could not process this photo. Please try another.')}};image.src=reader.result};reader.readAsDataURL(file)}
function reportForm(){return `<div class="photo-report"><h4>Add a photo</h4><p>Show the issue clearly so the maintenance team can review it.</p><div class="photo-actions"><label class="photo-pick">${icon('camera')} Take photo<input type="file" accept="image/*" capture="environment" aria-label="Take a photo" onchange="readPhoto(this)"></label><label class="photo-pick">Choose photo<input type="file" accept="image/*" aria-label="Choose a photo" onchange="readPhoto(this)"></label></div>${photoData(draftPhoto)?`<img class="photo-preview" src="${photoData(draftPhoto)}" alt="Preview of the issue photo">`:''}<p class="photo-hint">Photo required · For this prototype, the report stays in this browser on this device.</p><button class="big-button issue" onclick="act('issue')" ${draftPhoto?'':'disabled'}>Send report</button><button class="report-cancel" onclick="cancelReport()">Cancel</button></div>`}
function badge(label,color){return `<span class="status ${color}">${label}</span>`}function status(){return state.stage==='issue'?badge('● Suspended','red'):state.stage==='completed'?badge('● Completed','green'):state.stage==='fixed'?badge('● Repair complete','green'):state.stage==='passed'?badge('● Ready to dispatch','green'):badge('● Awaiting check','amber')}
function header(title,desc,section='WORKSPACE'){return `<div class="eyebrow">${section}</div><div class="heading"><div><h1>${title}</h1><p>${desc}</p></div><div class="datebox">◷ &nbsp; Monday, 16 November 2026</div></div><div class="demo-note"><span><b>Interactive prototype</b> &nbsp;·&nbsp; Explore a connected trip using simulated data. No live systems are connected.</span><button class="reset" onclick="act('reset')">↺ &nbsp;Reset demo</button></div>`}
function tripTable(){return `<div class="table-wrap"><table><thead><tr><th>Trip / vehicle</th><th>Route</th><th>Driver</th><th>Status</th></tr></thead><tbody><tr><td><div class="vehicle"><span class="truck">${icon('truck')}</span><span>#8801<br><small style="color:#9aa8b8;font-weight:500">BPT-042</small></span></div></td><td>Bangkok → Chonburi</td><td>Somchai P.</td><td>${status()}</td></tr><tr><td><div class="vehicle"><span class="truck">${icon('truck')}</span><span>#8802<br><small style="color:#9aa8b8;font-weight:500">BPT-017</small></span></div></td><td>Bangkok → Rayong</td><td>Arthit K.</td><td>${badge('● In transit','blue')}</td></tr><tr><td><div class="vehicle"><span class="truck">${icon('truck')}</span><span>#8803<br><small style="color:#9aa8b8;font-weight:500">BPT-028</small></span></div></td><td>Chonburi → Bangkok</td><td>Prasert S.</td><td>${badge('● In transit','blue')}</td></tr></tbody></table></div>`}
function flow(){let n=state.stage==='waiting'?0:state.stage==='issue'?1:state.stage==='passed'||state.stage==='fixed'?2:3;return `<div class="card workflow"><div class="panel-head"><div><h2>One trip, one connected workflow</h2><p>Follow Trip #8801 across teams</p></div><button class="link" onclick="go('driver')">START DEMO →</button></div><div class="flow">${[['Driver','Pre-trip check'],['Maintenance','Resolve issue'],['Operations','Complete trip'],['Finance','Create invoice']].map((x,i)=>`<div class="step ${i===n?'active':i<n?'done':''}"><span class="num">${i<n?'✓':'0'+(i+1)}</span><div><b>${x[0]}</b><small>${x[1]}</small></div></div>`).join('')}</div></div>`}
function management(){return header('Good morning, Management','Your operations at a glance. Everything connected, in one place.','EXECUTIVE OVERVIEW')+`<div class="kpis"><div class="card kpi"><div class="kpi-top">Active trips <span class="kpi-icon">${icon('route')}</span></div><strong>24</strong><small><em>+3 trips</em> vs. yesterday</small></div><div class="card kpi"><div class="kpi-top">Fleet availability <span class="kpi-icon">${icon('truck')}</span></div><strong>${state.stage==='issue'?'94':'96'}%</strong><small>${state.stage==='issue'?'1 vehicle requires attention':'48 of 50 vehicles ready'}</small></div><div class="card kpi"><div class="kpi-top">Open alerts <span class="kpi-icon">${icon('alert')}</span></div><strong>${state.stage==='issue'?'03':'02'}</strong><small>${state.stage==='issue'?'1 new pre-trip issue':'No critical alerts'}</small></div><div class="card kpi"><div class="kpi-top">Ready to invoice <span class="kpi-icon">${icon('receipt')}</span></div><strong>${state.stage==='completed'?'09':'08'}</strong><small>Trips awaiting finance</small></div></div><div class="grid"><section class="card panel"><div class="panel-head"><div><h2>Live trip overview</h2><p>Today's dispatch activity</p></div><button class="link" onclick="go('operations')">VIEW OPERATIONS →</button></div>${tripTable()}</section><section class="card panel"><div class="panel-head"><div><h2>Attention & activity</h2><p>Updates across your operation</p></div>${badge(state.stage==='issue'?'1 NEW':'LIVE','blue')}</div>${state.stage==='issue'?`<div class="activity"><div class="activity-icon" style="background:#fceced;color:#bc5052">${icon('alert')}</div><div><b>Vehicle BPT-042 suspended</b><p>Driver reported a brake warning on Trip #8801.</p></div><time>Just now</time></div>`:''}<div class="activity"><div class="activity-icon">${icon('check')}</div><div><b>Pre-trip checks in progress</b><p>Drivers are preparing for dispatch.</p></div><time>09:24</time></div><div class="activity"><div class="activity-icon">${icon('route')}</div><div><b>Trip #8802 is on the move</b><p>Bangkok to Rayong · GPS active</p></div><time>09:10</time></div><div class="activity"><div class="activity-icon">${icon('receipt')}</div><div><b>Invoices ready for review</b><p>Finance has 8 completed trips to review.</p></div><time>08:45</time></div></section></div>${flow()}`}
function operations(){return header('Operations','Monitor dispatch, vehicle readiness and trip progress.','DISPATCH BOARD')+`<div class="grid"><section class="card main-panel"><div class="panel-head"><div><h2>Today's dispatch board</h2><p>3 trips shown · Demo data</p></div>${badge('LIVE BOARD','blue')}</div>${tripTable()}</section><section class="card main-panel"><div class="panel-head"><div><h2>Trip #8801</h2><p>Bangkok → Chonburi</p></div>${status()}</div><div class="detail-grid"><div class="detail"><small>VEHICLE</small><b>BPT-042</b></div><div class="detail"><small>DRIVER</small><b>Somchai P.</b></div><div class="detail"><small>DEPARTURE</small><b>10:30 AM</b></div></div>${state.stage==='issue'?`<div class="alert"><b>Dispatch suspended</b><br>Brake warning reported. Maintenance ticket MT-204 has been created.</div><button class="button secondary" onclick="go('maintenance')">View maintenance ticket →</button>`:state.stage==='waiting'?`<div class="empty">Waiting for the driver's pre-trip inspection.<br><button class="link" onclick="go('driver')">OPEN DRIVER APP →</button></div>`:state.stage==='completed'?`<div class="alert" style="background:#eff9f5;border-color:#d4eee2;color:#217a60"><b>Trip completed</b><br>Billable trip data is available in Finance.</div><button class="button secondary" onclick="go('finance')">Open Finance →</button>`:`<div class="alert" style="background:#eff9f5;border-color:#d4eee2;color:#217a60"><b>Vehicle ready</b><br>${state.stage==='fixed'?'The reported issue has been resolved.':'The driver passed the pre-trip check.'} Complete the trip to send its data to Finance.</div><button class="button" onclick="act('complete')">Mark trip as completed</button>`}</section></div>${flow()}`}
function driver(){return header('Driver App','A simple pre-trip check, inside the familiar BPT Booking App.','MOBILE EXPERIENCE')+`<div class="phone-wrap"><div class="phone"><div class="phone-top"><small>‹ &nbsp; BPT BOOKING APP</small><b>Pre-trip inspection</b><small>Trip #8801 · Bangkok → Chonburi</small></div><div class="phone-body"><div class="phone-card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3>Ready for the road?</h3><p>Vehicle BPT-042 · 10:30 AM</p></div>${status()}</div></div><div class="phone-card"><h3>Vehicle safety check</h3><p>Check your vehicle before starting the trip.</p><div class="check-row"><span class="check-label">${icon('tyres')} Tyres & exterior</span><span>Check</span></div><div class="check-row"><span class="check-label">${icon('light')} Lights & signals</span><span>Check</span></div><div class="check-row"><span class="check-label">${icon('brakes')} Brakes & dashboard</span><span>Check</span></div><button class="big-button pass" onclick="act('pass')" ${state.stage!=='waiting'||reporting?'disabled':''}>${icon('check')} All checks passed</button><button class="big-button issue" onclick="startReport()" ${state.stage!=='waiting'||reporting?'disabled':''}>${icon('alert')} Report an issue</button>${reporting?reportForm():''}</div><p style="text-align:center;color:#9aa7b5;font-size:10px">Demo reports are saved in this browser on this device.</p></div></div><div class="card guide"><div class="eyebrow">DESIGNED FOR DRIVERS</div><h2>Simple by design.</h2><p class="sub">A familiar experience, with two clear choices. For this demo, reporting an issue simulates a brake warning and connects the teams immediately.</p><div class="guide-list"><div class="guide-item"><span>1</span><div><b>Check the vehicle</b>Review the essentials before departure.</div></div><div class="guide-item"><span>2</span><div><b>Tap report an issue</b>Take or choose a photo, then send the report to create a ticket.</div></div><div class="guide-item"><span>3</span><div><b>Follow the update</b>Operations and management see the same status.</div></div></div><button class="button secondary" onclick="go('operations')">View dispatch board →</button></div></div>`}
function maintenance(){return header('Maintenance','Turn driver reports into clear, actionable work.','FLEET CARE')+`<div class="grid"><section class="card main-panel"><div class="panel-head"><div><h2>Maintenance queue</h2><p>Driver-reported issues and repair progress</p></div>${badge('DEMO QUEUE','blue')}</div>${state.stage==='issue'||state.stage==='fixed'||(state.stage==='completed'&&state.repaired)?`<div class="detail-grid"><div class="detail"><small>TICKET</small><b>MT-204</b></div><div class="detail"><small>VEHICLE</small><b>BPT-042</b></div><div class="detail"><small>PRIORITY</small><b>High</b></div></div><h3 class="section-title">Brake warning reported</h3><p class="sub">Trip #8801 · Driver pre-trip inspection · Bangkok depot</p>${photoData(state.photo)?`<div class="ticket-photo"><b>Driver's photo</b><img src="${photoData(state.photo)}" alt="Photo of the issue reported by the driver"><p class="photo-hint">Photo attached to this demo report.</p></div>`:''}<div style="margin:16px 0">${state.stage==='issue'?badge('● Open · Vehicle suspended','red'):badge('✓ Repair complete','green')}</div>${state.stage==='issue'?`<div class="actions"><button class="button secondary" onclick="act('diagnose')">${icon('spark')} AI Diagnostics</button><button class="button" onclick="act('fix')">Mark as fixed</button></div>`:''}${state.diagnosed?`<div class="diagnosis"><b>✦ Suggested action plan</b><br>Demo recommendation based on a simulated brake warning.<ol><li>Inspect brake fluid level and check for visible leaks.</li><li>Check brake pads, sensors and warning codes.</li><li>Perform a safety test and document the repair before release.</li></ol><p style="margin-bottom:0">Estimated repair allocation: <b>฿2,800</b> · Technician review required.</p></div>`:''}`:`<div class="empty">No ticket for Trip #8801 yet.<br>Report an issue in the Driver App to create one.<br><button class="link" onclick="go('driver')">OPEN DRIVER APP →</button></div>`}</section><section class="card main-panel"><div class="eyebrow">CONNECTED HANDOFF</div><h2 class="section-title" style="margin-top:10px">From report to repair</h2><p class="sub">When a driver flags an issue, the dispatch board reflects the vehicle status and the maintenance team gets the context they need.</p><div class="guide-list"><div class="guide-item"><span>1</span><div><b>Driver reports</b>Issue linked to the vehicle and trip.</div></div><div class="guide-item"><span>2</span><div><b>Maintenance reviews</b>A simulated diagnostic plan supports the technician.</div></div><div class="guide-item"><span>3</span><div><b>Vehicle released</b>Operations can complete the trip after repair.</div></div></div></section></div>${flow()}`}
function finance(){return header('Finance','From completed trip to invoice, without re-entering the details.','FINANCIAL WORKSPACE')+`<div class="grid"><section class="card main-panel"><div class="panel-head"><div><h2>Trip #8801 billing</h2><p>Connected trip and maintenance information</p></div>${state.invoice?badge('✓ Draft created','green'):state.stage==='completed'?badge('● Ready to invoice','blue'):badge('● Awaiting trip completion','gray')}</div><div class="detail-grid"><div class="detail"><small>CUSTOMER</small><b>Eastern Logistics Co.</b></div><div class="detail"><small>ROUTE</small><b>Bangkok → Chonburi</b></div><div class="detail"><small>VEHICLE</small><b>BPT-042</b></div></div>${state.stage==='completed'?`<table><tbody><tr><td>Transport service</td><td style="text-align:right">฿18,500</td></tr><tr><td>Repair cost allocation <small style="color:#95a4b4">(internal)</small></td><td style="text-align:right">${state.repaired?'฿2,800':'฿0'}</td></tr></tbody></table><div style="border-top:1px solid #edf0f4;padding-top:16px"><small style="color:#91a0af">CUSTOMER INVOICE TOTAL</small><div class="finance-total">฿18,500</div><p class="sub">Repair cost is shown as an internal allocation and is not added to the customer invoice.</p></div><div style="margin-top:20px"><button class="button" onclick="act('invoice')" ${state.invoice?'disabled':''}>${state.invoice?'✓ Draft invoice generated':'Generate draft invoice'}</button></div>${state.invoice?`<div class="diagnosis"><b>Draft invoice INV-8801</b><br>Eastern Logistics Co. · Trip #8801 · ฿18,500<br>This is a simulated draft for presentation purposes.</div>`:''}`:`<div class="empty">Trip data becomes billable after Operations marks the trip complete.<br><button class="link" onclick="go('operations')">GO TO OPERATIONS →</button></div>`}</section><section class="card main-panel"><div class="eyebrow">CONNECTED DATA</div><h2 class="section-title" style="margin-top:10px">One source of truth</h2><p class="sub">Trip details flow from dispatch to Finance. If a repair was recorded, its simulated cost allocation appears alongside the trip for review.</p><div class="guide-list"><div class="guide-item"><span>✓</span><div><b>Trip details carried forward</b>Route, vehicle and customer information in one place.</div></div><div class="guide-item"><span>✓</span><div><b>Repair costs visible</b>Internal allocation is kept separate from customer billing.</div></div><div class="guide-item"><span>✓</span><div><b>Invoice ready to review</b>Generate a draft after the trip is complete.</div></div></div></section></div>${flow()}`}
function render(){document.getElementById('crumb').textContent=views.find(x=>x[0]===state.view)[2];document.getElementById('sideNav').innerHTML=views.map(x=>`<button class="${state.view===x[0]?'active':''}" onclick="go('${x[0]}')"><span class="icon">${icon(x[1])}</span><span class="label">${x[2]}</span></button>`).join('');document.getElementById('mobileNav').innerHTML=views.map(x=>`<button class="${state.view===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${icon(x[1])}</span>${x[2]}</button>`).join('');document.getElementById('content').innerHTML=({management,operations,driver,maintenance,finance}[state.view])()+`<footer class="foot"><span>© BPT ONE · Connected operations prototype</span><span>Illustrative data for presentation purposes</span></footer>`}render();
</script></body></html>
